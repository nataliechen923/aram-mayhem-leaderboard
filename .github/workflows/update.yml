name: Update leaderboard daily

# 12:00 AM CST = 06:00 UTC (Nov–Mar, CST is UTC-6).
# GitHub cron runs in UTC and can start a few minutes late — that is normal.
# During daylight time (CDT, UTC-5) this same cron lands at 1:00 AM CDT.
# If you want it at midnight CDT in summer too, change 6 to 5 in March.
on:
  push:
    # The Chrome extension commits the fresh export itself
    # (data/extension-export.json) when a token is saved — that
    # commit starts this workflow automatically, so one click in
    # Chrome syncs the page with nothing to drag and nothing to
    # run by hand. Only that one file triggers a run: the
    # workflow's own commits (data.json, cache) never match this
    # path filter, and its commit message carries [skip ci] too,
    # so it can never retrigger itself.
    paths:
      - "data/extension-export.json"
  schedule:
    # 12:00 AM CST = 06:00 UTC. Retry at 12:30 AM CST in case the first
    # run hit a transient PlayARAM block — the updater is idempotent
    # (one history point per day, cached matches), so a second run is safe.
    - cron: "0 6 * * *"
    - cron: "30 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aram-mayhem-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # If the Chrome extension's export is waiting (data/extension-export.json
      # — the extension commits it itself when a token is saved, or
      # Natalie drags the downloaded file in, renamed to that fixed name),
      # import it and remove it so it is never imported twice. Otherwise
      # run the normal PlayARAM fetch, which fails gracefully when
      # Cloudflare blocks GitHub's computers. The file is removed only
      # when the import succeeds: a broken export is moved aside by the
      # updater as extension-export-failed-<date>.json instead, and the
      # run stays green with the error recorded on the page.
      - name: Update data (last 50 games per player)
        run: |
          if [ -f data/extension-export.json ]; then
            python scripts/update.py --from-extension data/extension-export.json
            rm -f data/extension-export.json
          else
            python scripts/update.py
          fi

      # Commit the updated snapshot AND the per-player PlayARAM cache
      # (data/cache/playaram/) — the cache is how the last-50 window
      # fills over the first few runs, since each fetch only shows 20
      # games. Without it, every run would start from zero.
      # [skip ci] in the message is LOOP SAFETY: this workflow is
      # triggered by pushes that touch data/extension-export.json,
      # and this commit deletes that file — without [skip ci] it
      # would trigger itself forever. With it, GitHub does not start
      # a new run for this commit at all.
      - name: Commit updated data if it changed
        run: |
          git config user.name "aram-mayhem-bot"
          git config user.email "aram-mayhem-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Daily update: last 50 ARAM Mayhem games per player [skip ci]"
          git push

      # Freshness gate: fails the run (and GitHub emails the repo owner)
      # only when the data is stale AND the last attempt recorded an
      # error — i.e. the automation itself is broken. Stays quiet
      # before setup is done and while a good snapshot is being kept.
      - name: Check data freshness
        run: python scripts/check_fresh.py 72
